name: Navix Desktop - Windows piloto
on:
  push:
    branches: [feature/navix-desktop-zero, codex/navix-desktop-full-tools]
    paths: ['desktop/**', '.github/workflows/navix-desktop.yml']
  pull_request:
    branches: [feature/navix-desktop-zero]
    paths: ['desktop/**', '.github/workflows/navix-desktop.yml']
  workflow_dispatch:
concurrency:
  group: navix-desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - name: Testes com navegador real
        shell: pwsh
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NAVIX_TEST_BROWSER = '1'
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Empacotar navegador e aplicativo
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD\browsers"
          python -m playwright install --no-shell chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m navix.brand
          python -m pip freeze | Out-File -Encoding utf8 DEPENDENCIES.txt
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name NavixDesktop --icon assets/navix.ico --add-data "assets;assets" --hidden-import pystray._win32 --collect-all playwright --collect-submodules mcp.server --collect-submodules mcp.shared --collect-data mcp --copy-metadata mcp --copy-metadata playwright --copy-metadata PyAutoGUI --copy-metadata Pillow --add-data "browsers;browsers" launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --console --onedir --name NavixPython --collect-all playwright --collect-all mcp --hidden-import pyautogui --hidden-import PIL.Image --hidden-import tkinter python_runner.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\NavixPython dist\NavixDesktop\python-runtime -Recurse
      - name: Incorporar tunnel-client oficial com SHA-256 verificado
        shell: pwsh
        run: |
          $version = 'v0.0.18'
          $archive = 'tunnel-client-v0.0.18-windows-amd64.zip'
          $base = "https://github.com/openai/tunnel-client/releases/download/$version"
          Invoke-WebRequest "$base/$archive" -OutFile $archive
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile SHA256SUMS.txt
          $line = Get-Content SHA256SUMS.txt | Where-Object { $_ -match [regex]::Escape($archive) } | Select-Object -First 1
          if (!$line -or $line -notmatch '^([a-fA-F0-9]{64})\s+') { throw 'Hash oficial não encontrado' }
          $expected = $Matches[1].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'SHA-256 do tunnel-client diverge do release oficial' }
          Expand-Archive $archive -DestinationPath tunnel-client-extracted
          $binary = Get-ChildItem tunnel-client-extracted -Filter tunnel-client.exe -Recurse | Select-Object -First 1
          if (!$binary) { throw 'Binário tunnel-client.exe ausente' }
          $companion = Get-ChildItem tunnel-client-extracted -Filter cloudflared.exe -Recurse | Select-Object -First 1
          if (!$companion) { throw 'Companion oficial cloudflared.exe ausente do release' }
          $manifest = Get-ChildItem tunnel-client-extracted -Filter cloudflared-manifest.json -Recurse | Select-Object -First 1
          if (!$manifest) { throw 'Manifesto do cloudflared ausente do release' }
          Copy-Item $binary.FullName dist\NavixDesktop\tunnel-client.exe
          Copy-Item $companion.FullName dist\NavixDesktop\cloudflared.exe
          Copy-Item $manifest.FullName dist\NavixDesktop\cloudflared-manifest.json
          Invoke-WebRequest 'https://raw.githubusercontent.com/openai/tunnel-client/v0.0.18/LICENSE' -OutFile dist\NavixDesktop\tunnel-client-LICENSE.txt
          & dist\NavixDesktop\tunnel-client.exe help quickstart | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cliente de túnel não executou no Windows' }
          & dist\NavixDesktop\tunnel-client.exe cloudflared version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Companion cloudflared não foi reconhecido' }
      - name: Verificar abertura do executável
        shell: pwsh
        run: |
          $app = Start-Process dist\NavixDesktop\NavixDesktop.exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw 'O aplicativo encerrou durante abertura' }
          Stop-Process -Id $app.Id
      - name: Teste completo do aplicativo empacotado
        shell: pwsh
        run: |
          $report = "$PWD\packaged-selftest.json"
          $check = Start-Process dist\NavixDesktop\NavixDesktop.exe -ArgumentList '--self-test', $report -Wait -PassThru
          Get-Content $report
          if ($check.ExitCode -ne 0) { throw 'Teste completo do aplicativo falhou' }
      - name: Gerar instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash output\*.exe -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 output\SHA256.txt
          Copy-Item DEPENDENCIES.txt output\
          Copy-Item packaged-selftest.json output\
      - name: Testar instalação e desinstalação
        shell: pwsh
        run: |
          $install = Start-Process output\NavixDesktop-Setup-0.2.10.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Instalação falhou' }
          $exe = "$env:LOCALAPPDATA\Programs\NavixDesktop\NavixDesktop.exe"
          if (!(Test-Path $exe)) { throw 'Executável instalado não encontrado' }
          if (!(Test-Path "$env:LOCALAPPDATA\Programs\NavixDesktop\tunnel-client.exe")) { throw 'Cliente de túnel não foi incorporado ao instalador' }
          if (!(Test-Path "$env:LOCALAPPDATA\Programs\NavixDesktop\cloudflared.exe")) { throw 'Companion cloudflared não foi incorporado ao instalador' }
          if (!(Test-Path "$env:LOCALAPPDATA\Programs\NavixDesktop\cloudflared-manifest.json")) { throw 'Manifesto cloudflared não foi incorporado' }
          if (!(Test-Path "$env:LOCALAPPDATA\Programs\NavixDesktop\tunnel-client-LICENSE.txt")) { throw 'Licença do cliente de túnel ausente' }
          if (!(Test-Path "$env:LOCALAPPDATA\Programs\NavixDesktop\unins000.exe")) { throw 'Desinstalador não foi instalado' }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Navix Desktop\Desinstalar NavixX Desktop.lnk")) { throw 'Atalho para desinstalar não encontrado' }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw 'Aplicativo instalado não abriu' }
          Stop-Process -Id $app.Id
          $remove = Start-Process "$env:LOCALAPPDATA\Programs\NavixDesktop\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw 'Desinstalação falhou' }
          if (Test-Path $exe) { throw 'Executável permaneceu após desinstalar' }
      - uses: actions/upload-artifact@v4
        with:
          name: NavixDesktop-Windows-Piloto
          path: desktop/output/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NavixDesktop-Diagnostico
          path: desktop/packaged-selftest.json

  publish_windows:
    name: Publicar instalador público (pré-lançamento)
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/navix-desktop-full-tools'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NavixDesktop-Windows-Piloto
          path: release
      - name: Conferir artefato antes da publicação
        shell: bash
        run: |
          test -s release/NavixDesktop-Setup-0.2.10.exe
          test -s release/SHA256.txt
          test -s release/packaged-selftest.json
      - name: Publicar pré-lançamento no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create navix-desktop-v0.2.10 release/* \
            --target "$GITHUB_SHA" \
            --title "NavixX Desktop 0.2.10 — Ícones sem quadrado, menu petróleo e layout compacto" \
            --notes "NavixX Desktop 0.2.10: remove o quadrado azul atrás do símbolo no cabeçalho da instalação, com PNG transparente; substitui os ícones genéricos do menu por desenhos vetoriais de linha iluminada, sem placas; menu em azul-petróleo; idioma fixado no rodapé para permanecer visível; interface compacta para telas pequenas, com textos mais curtos e painéis reorganizados. Mantém o sistema de conexão, cofre de senhas, logs, desinstalador e doações Pix da versão 0.2.9. O recurso multi-PC por convite está em planejamento, não foi ativado. PRÉ-LANÇAMENTO SEM ASSINATURA DIGITAL: Android/iOS e publicação nas lojas pendentes." \
            --prerelease
