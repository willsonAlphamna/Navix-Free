name: Circuito Vivo - voz neural PTBR (temporario)
on:
  push:
    branches:
      - circuito-vivo-voz-ptbr-teste-20261023
    paths:
      - .github/workflows/cv-voz-natural-ptbr.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gerar-narracao:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Instalar sintetizador neural
        run: |
          python -m pip install --disable-pip-version-check -q "edge-tts>=7.0,<9"
      - name: Gerar narracoes brasileiras e legendas
        shell: bash
        run: |
          mkdir -p outputs
          cat > voice.py <<'PY'
          import asyncio, json, re
          from pathlib import Path
          import edge_tts
          text = ("Perdeu o manual do seu aparelho? No Circuito Vivo, procure pela marca e pelo modelo exato. "
                  "Tem um celular antigo? Comece pelo código certo. Impressora Epson? Encontre a ficha do modelo. "
                  "Até seu roteador tem um caminho para o suporte oficial. São oitenta e seis fichas e guias organizados. "
                  "Circuito Vivo: pesquise de graça e encontre seu modelo!")
          async def generate(voice, label):
              try:
                  com = edge_tts.Communicate(text, voice, rate="+10%", pitch="+0Hz")
                  chunks = []
                  words = []
                  async for part in com.stream():
                      if part["type"] == "audio":
                          chunks.append(part["data"])
                      elif part["type"] == "WordBoundary":
                          words.append(dict(start=part["offset"]/1e7,
                                            duration=part["duration"]/1e7,
                                            text=part["text"]))
                  Path(f"outputs/circuito_vivo_{label}.mp3").write_bytes(b"".join(chunks))
                  Path(f"outputs/circuito_vivo_{label}_words.json").write_text(json.dumps(words,ensure_ascii=False,indent=2),encoding="utf-8")
                  print(f"OK {label} audio={sum(map(len,chunks))} bytes words={len(words)}")
              except Exception as exc:
                  print(f"FAIL {label}: {type(exc).__name__}: {exc}")
          async def main():
              await generate("pt-BR-FranciscaNeural","francisca")
              await generate("pt-BR-ThalitaNeural","thalita")
              if not list(Path("outputs").glob("*.mp3")):
                  raise RuntimeError("Nenhuma voz gerada")
          asyncio.run(main())
          PY
          python voice.py
      - name: Disponibilizar MP3 e pontos de sincronismo
        uses: actions/upload-artifact@v4
        with:
          name: circuito-vivo-voz-neural-ptbr
          path: outputs/
          if-no-files-found: error
          retention-days: 7
