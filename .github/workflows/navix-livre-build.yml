name: Navix Livre - Instalador Windows

on:
  push:
    branches: ["feature/navix-livre-mcp"]
    paths:
      - "navix-livre/**"
      - ".github/workflows/navix-livre-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Testes do projeto
        working-directory: navix-livre
        run: python -m unittest discover -s . -p "test*.py" -v

      - name: Instalar ferramentas de compilacao
        run: |
          python -m pip install pyinstaller==6.16.0 pillow==11.3.0
          choco install innosetup -y --no-progress

      - name: Gerar icones e imagens do instalador
        working-directory: navix-livre
        run: python make_assets.py

      - name: Compilar painel Windows
        working-directory: navix-livre
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NavixLivre --icon assets/navix.ico --add-data "assets/navix.ico;." navix_livre.py

      - name: Testar abertura real do painel
        working-directory: navix-livre
        shell: pwsh
        run: |
          $app = (Resolve-Path ".\\dist\\NavixLivre.exe").Path
          $processo = Start-Process -FilePath $app -PassThru
          try {
            Start-Sleep -Seconds 9
            $processo.Refresh()
            if ($processo.HasExited) {
              throw "Painel terminou inesperadamente com codigo $($processo.ExitCode)"
            }
            Write-Host "Painel Windows iniciou e permaneceu ativo."
          } finally {
            $processo.Refresh()
            if (-not $processo.HasExited) {
              Stop-Process -Id $processo.Id -Force
            }
          }

      - name: Compilar ponte local MCP
        working-directory: navix-livre
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name NavixBridge navix_remote.py

      - name: Testar executavel da ponte
        working-directory: navix-livre
        shell: pwsh
        run: |
          $path = & ".\dist\NavixBridge.exe" --show-token-path
          if ($LASTEXITCODE -ne 0 -or -not ($path -match 'bridge.token')) {
            throw "O executavel da ponte falhou."
          }
          Write-Host "Ponte local OK; segredo nao exibido."

      - name: Criar instalador
        working-directory: navix-livre
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            throw "Compilador Inno Setup nao encontrado"
          }
          & $compiler "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar instalador" }
          if (-not (Test-Path ".\dist-install\NavixLivre-Setup-Windows.exe")) { throw "Instalador nao criado" }

      - name: Testar instalacao e desinstalacao no runner
        working-directory: navix-livre
        shell: pwsh
        run: |
          $setup = (Resolve-Path ".\dist-install\NavixLivre-Setup-Windows.exe").Path
          $processo = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/NORESTART" -Wait -PassThru
          if ($processo.ExitCode -ne 0) { throw "Falha ao instalar" }
          $target = Join-Path $env:LOCALAPPDATA "Programs\NavixLivre"
          if (-not (Test-Path (Join-Path $target "NavixLivre.exe"))) { throw "Painel nao instalado" }
          if (-not (Test-Path (Join-Path $target "NavixBridge.exe"))) { throw "Ponte nao instalada" }
          $uninstall = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstall)) { throw "Desinstalador ausente" }
          $secretFolder = Join-Path $env:LOCALAPPDATA "NavixLivre"
          New-Item -ItemType Directory -Path $secretFolder -Force | Out-Null
          Set-Content -Path (Join-Path $secretFolder "bridge.token") -Value "fake-test-secret-only"
          $un = Start-Process -FilePath $uninstall -ArgumentList "/VERYSILENT","/NORESTART" -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "Falha ao desinstalar" }
          if (Test-Path (Join-Path $target "NavixLivre.exe")) { throw "Painel permaneceu instalado" }
          if (Test-Path (Join-Path $target "NavixBridge.exe")) { throw "Ponte permaneceu instalada" }
          if (Test-Path (Join-Path $secretFolder "bridge.token")) { throw "Credencial permaneceu apos desinstalacao" }

      - name: Calcular SHA-256 do instalador
        working-directory: navix-livre
        shell: pwsh
        run: |
          $asset = ".\\dist-install\\NavixLivre-Setup-Windows.exe"
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path ".\\dist-install\\SHA256.txt" -Value "$hash  NavixLivre-Setup-Windows.exe" -Encoding ascii

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: NavixLivre-Instalador-Windows
          path: navix-livre/dist-install/*
          if-no-files-found: error
          retention-days: 90

      - name: Publicar portatil
        uses: actions/upload-artifact@v4
        with:
          name: NavixLivre-Portatil-Windows
          path: |
            navix-livre/dist/NavixLivre.exe
            navix-livre/dist/NavixBridge.exe
            navix-livre/README.md
            navix-livre/COMO_INSTALAR.md
          if-no-files-found: error
          retention-days: 90

      - name: Publicar release para download permanente
        if: github.ref == 'refs/heads/feature/navix-livre-mcp'
        continue-on-error: true
        working-directory: navix-livre
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "navix-livre-v0.3.0"
          $installer = "dist-install\\NavixLivre-Setup-Windows.exe"
          $checksum = "dist-install\\SHA256.txt"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $checksum --clobber
          } else {
            gh release create $tag $installer $checksum --target $env:GITHUB_SHA --title "Navix Livre 0.3.0 - Windows" --notes "Instalador gratuito do Navix Livre para Windows. Inclui painel escuro com arquivos, terminal e processos, ponte MCP local e desinstalador. A conexao remota ao ChatGPT nao e automatica."
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha em publicar release" }
