name: Navix Livre - Instalador Windows

on:
  push:
    branches: ["feature/navix-livre-mcp"]
    paths:
      - "navix-livre/**"
      - ".github/workflows/navix-livre-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Testes do projeto
        working-directory: navix-livre
        run: python -m unittest discover -s . -p "test*.py" -v

      - name: Instalar ferramentas de compilacao
        run: |
          python -m pip install pyinstaller==6.16.0
          choco install innosetup -y --no-progress

      - name: Compilar painel Windows
        working-directory: navix-livre
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NavixLivre navix_livre.py

      - name: Compilar ponte local MCP
        working-directory: navix-livre
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name NavixBridge navix_remote.py

      - name: Testar executavel da ponte
        working-directory: navix-livre
        shell: pwsh
        run: |
          $path = & ".\dist\NavixBridge.exe" --show-token-path
          if ($LASTEXITCODE -ne 0 -or -not ($path -match 'bridge.token')) {
            throw "O executavel da ponte falhou."
          }
          Write-Host "Ponte local OK; segredo nao exibido."

      - name: Criar instalador
        working-directory: navix-livre
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            throw "Compilador Inno Setup nao encontrado"
          }
          & $compiler "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar instalador" }
          if (-not (Test-Path ".\dist-install\NavixLivre-Setup-Windows.exe")) { throw "Instalador nao criado" }

      - name: Testar instalacao e desinstalacao no runner
        working-directory: navix-livre
        shell: pwsh
        run: |
          $setup = (Resolve-Path ".\dist-install\NavixLivre-Setup-Windows.exe").Path
          $processo = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/NORESTART" -Wait -PassThru
          if ($processo.ExitCode -ne 0) { throw "Falha ao instalar" }
          $target = Join-Path $env:LOCALAPPDATA "Programs\NavixLivre"
          if (-not (Test-Path (Join-Path $target "NavixLivre.exe"))) { throw "Painel nao instalado" }
          if (-not (Test-Path (Join-Path $target "NavixBridge.exe"))) { throw "Ponte nao instalada" }
          $uninstall = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstall)) { throw "Desinstalador ausente" }
          $un = Start-Process -FilePath $uninstall -ArgumentList "/VERYSILENT","/NORESTART" -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "Falha ao desinstalar" }

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: NavixLivre-Instalador-Windows
          path: navix-livre/dist-install/NavixLivre-Setup-Windows.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publicar portatil
        uses: actions/upload-artifact@v4
        with:
          name: NavixLivre-Portatil-Windows
          path: |
            navix-livre/dist/NavixLivre.exe
            navix-livre/dist/NavixBridge.exe
            navix-livre/README.md
          if-no-files-found: error
          retention-days: 90
