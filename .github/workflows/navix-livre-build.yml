name: Navix Livre - Executavel Windows

on:
  push:
    branches: ["feature/navix-livre-mcp"]
    paths:
      - "navix-livre/**"
      - ".github/workflows/navix-livre-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Executar testes
        working-directory: navix-livre
        run: python -m unittest test_navix -v

      - name: Instalar empacotador
        run: python -m pip install pyinstaller==6.16.0

      - name: Gerar executavel portatil
        working-directory: navix-livre
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NavixLivre navix_livre.py

      - name: Disponibilizar para download
        uses: actions/upload-artifact@v4
        with:
          name: NavixLivre-Windows-Portable
          path: navix-livre/dist/NavixLivre.exe
          if-no-files-found: error
          retention-days: 30
