name: NavixX Cloud - testes de isolamento
on:
  push:
    branches: [codex/navixx-cloud-v0_3-foundation]
    paths: ['cloud/**', '.github/workflows/navix-cloud.yml']
  pull_request:
    paths: ['cloud/**', '.github/workflows/navix-cloud.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: cloud
      - run: npm test
        working-directory: cloud
