name: NavixX Cloud - testes de isolamento
on:
  push:
    branches: [codex/navixx-cloud-v0_3-foundation, codex/navixx-cloud-audit-alpha8]
    paths: ['cloud/**', 'desktop/navix/browser.py', 'desktop/navix/gui.py', 'desktop/navix/cloud*.py', 'desktop/tests/test_browser_actions.py', 'desktop/tests/test_cloud*.py', 'desktop/requirements.txt', '.github/workflows/navix-cloud.yml']
  pull_request:
    paths: ['cloud/**', '.github/workflows/navix-cloud.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: cloud
      - run: npm test
        working-directory: cloud

      - name: Verificar pacote Cloudflare sem publicar
        run: npx wrangler deploy --dry-run
        working-directory: cloud
      - name: Auditar HTTPS e OAuth do Cloudflare publicado (somente leitura)
        run: node live-protocol-audit.mjs
        working-directory: cloud

  windows_browser:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m playwright install chromium
      - name: Compilar interface e controlador Cloud
        run: python -m compileall -q navix/gui.py navix/cloud_client.py navix/cloud_pair.py navix/cloud_controller.py navix/cloud_local_mcp.py
      - name: Validar navegador real e limites da nuvem
        env:
          NAVIX_TEST_BROWSER: '1'
        run: python -m pytest -q tests/test_browser_actions.py tests/test_browser_real.py tests/test_cloud.py tests/test_cloud_client.py tests/test_cloud_pair.py tests/test_cloud_local_mcp.py
