name: AEGIS Architecture CI
on:
  push:
    branches: [aegis-control-architecture]
  pull_request:
    paths:
      - 'aegis_core/**'
      - 'tests/**'
      - '.github/workflows/aegis-ci.yml'
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q aegis_core tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
