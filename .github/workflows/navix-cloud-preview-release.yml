name: NavixX Cloud Preview - distribuir instalador aprovado
on:
  push:
    branches: [codex/navixx-cloud-v0_3-foundation]
    paths: ['.github/workflows/navix-cloud-preview-release.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperar pacote do plugin do repositório
        uses: actions/checkout@v4
      - name: Recuperar artefato aprovado no Windows
        uses: actions/download-artifact@v4
        with:
          name: NavixX-0.3-CloudPreview-Windows
          run-id: 40637615879
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release
      - name: Validar instalador, autoteste e SHA-256
        shell: bash
        run: |
          set -euo pipefail
          installer='release/NavixDesktop-CloudPreview-Setup-0.3.0-alpha.5.exe'
          test -s "$installer"
          test -s release/SHA256.txt
          test -s release/packaged-selftest.json
          expected="$(sha256sum "$installer" | cut -d ' ' -f 1)"
          grep -qi "$expected" release/SHA256.txt
          test -s NavixX_ChatGPT_Plugin_0.3.zip
          unzip -t NavixX_ChatGPT_Plugin_0.3.zip
          cp NavixX_ChatGPT_Plugin_0.3.zip release/
      - name: Publicar pré-lançamento claramente identificado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create navixx-cloud-v0.3.0-alpha.5-preview release/* \
            --target '${{ github.sha }}' --prerelease --latest=false \
            --title 'NavixX Desktop Cloud Preview 0.3.0-alpha.5 (Windows)' \
            --notes 'VERSÃO DE TESTE NÃO ASSINADA. Instalação isolada que preserva NavixX 0.2.11. Compilação, testes Python/Windows, instalador e desinstalador aprovados no GitHub Actions 40637615879. Corrige os comandos rejeitados por diferenças moderadas de horário entre Windows e Cloudflare. O servidor passou no teste sintético de pareamento, OAuth, WebSocket, chamada MCP remota e revogação. A execução em Windows real segue sob verificação e permanece restrita a um dispositivo canário; aprovação pública no ChatGPT depende da revisão da plataforma. Inclui ZIP do plugin criado no ChatGPT. Documentação e código: pull request #13.'
