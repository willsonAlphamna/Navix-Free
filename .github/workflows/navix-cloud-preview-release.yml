name: NavixX Cloud Preview - distribuir instalador aprovado
on:
  push:
    branches: [codex/navixx-cloud-v0_3-foundation]
    paths: ['.github/workflows/navix-cloud-preview-release.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperar pacote do plugin do repositório
        uses: actions/checkout@v4
      - name: Recuperar artefato aprovado no Windows
        uses: actions/download-artifact@v4
        with:
          name: NavixX-0.3-CloudPreview-Windows
          run-id: 40633942931
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release
      - name: Validar instalador, autoteste e SHA-256
        shell: bash
        run: |
          set -euo pipefail
          installer='release/NavixDesktop-CloudPreview-Setup-0.3.0-alpha.4.exe'
          test -s "$installer"
          test -s release/SHA256.txt
          test -s release/packaged-selftest.json
          expected="$(sha256sum "$installer" | cut -d ' ' -f 1)"
          grep -qi "$expected" release/SHA256.txt
          test -s NavixX_ChatGPT_Plugin_0.3.zip
          unzip -t NavixX_ChatGPT_Plugin_0.3.zip
          cp NavixX_ChatGPT_Plugin_0.3.zip release/
      - name: Publicar pré-lançamento claramente identificado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create navixx-cloud-v0.3.0-alpha.4-preview release/* \
            --target '${{ github.sha }}' --prerelease --latest=false \
            --title 'NavixX Desktop Cloud Preview 0.3.0-alpha.4 (Windows)' \
            --notes 'VERSÃO DE TESTE NÃO ASSINADA. Preserva o NavixX 0.2.11 e dados originais por instalar em caminho e perfil separados. Testes de Python, Windows, empacotamento, instalador e desinstalador passaram na execução GitHub Actions 40633942931. A Cloudflare passou no teste sintético de pareamento, OAuth, WebSocket, execução MCP remota e revogação, com controle restrito ao dispositivo de teste; o controle de Windows real e a distribuição no catálogo público do ChatGPT dependem de validação adicional e aprovação da plataforma. Inclui ZIP do plugin para revisão/upload pelo proprietário. Não distribuir como produto final antes da conclusão dos testes e revisão. Documentação e código: pull request #13.'
